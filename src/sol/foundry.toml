[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "wormhole-foundation/=lib/wormhole/",
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[etherscan]
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
arbitrum-sepolia = "${ARBS_RPC}"
sepolia = "${SEPOLIA_RPC}"